logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    co.edu.sena.gymtrack: DEBUG

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false
  jackson:
    serialization:
      indent-output: true
  # --- SECCIÓN AÑADIDA PARA REPARAR LA BASE DE DATOS ---
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.format_sql: true
  # -----------------------------------------------------
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mariadb://localhost:3306/gymtrack?useLegacyDatetimeCode=false&connectTimeout=60000&socketTimeout=60000&useInformationSchema=false
    username: root
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  liquibase:
    contexts: dev, faker
    drop-first: false
    parameters:
      datetimeType: datetime(6)
      blobType: LONGBLOB
  mail:
    host: smtp.gmail.com
    port: 587
    username: gymtrack330@gmail.com
    password: srug hnlf bbhk fign
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: true
  messages:
    cache-duration: PT1S
  thymeleaf:
    cache: false

server:
  port: 8080
  forward-headers-strategy: native

jhipster:
  cors:
    allowed-origins: 'http://localhost:8100,https://localhost:8100,http://localhost:9000,https://localhost:9000,http://localhost:9060,https://localhost:9060'
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        base64-secret: Y2U1ZTYzNWNiMTg2MzMyYTMzNDBmNmRiNzBhYzFiYzE0MmEyYmJiNzEwZjkxY2RhMmRlZDBhOWIwNDM4NDZlM2YyZWRmMGViNzQ1MDhkZWE3NzViZmExN2YyMThkYjBmODVjMDI0OGJmMTNmN2Q5ZGZiOWQzMjRmMzA4YTFiMzI=
